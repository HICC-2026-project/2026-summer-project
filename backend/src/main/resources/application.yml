spring:
  data:
    web:
      pageable:
        max-page-size: 50   # 관리자 목록 등 Pageable 파라미터의 size 상한
  application:
    name: career-recommendation-service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/career_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate       # Flyway가 DDL 관리 — JPA는 검증만
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post   # 카카오 토큰 엔드포인트는 시크릿을 폼 파라미터로 받음 (기본값 basic이면 401)
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname
#          google:                      ← 나중에 추가할 때 주석 해제
#            client-id: ${GOOGLE_CLIENT_ID}
#            client-secret: ${GOOGLE_CLIENT_SECRET}
#            redirect-uri: "{baseUrl}/login/oauth2/code/google"
#            scope: email, profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
#          google:                      ← 나중에 추가할 때 주석 해제

server:
  port: 8080

app:
  ai:
    daily-attempts-per-user: ${AI_DAILY_ATTEMPTS_PER_USER:3}   # 사용자별 하루 Gemini 호출 시도 상한(추천·로드맵 각각). AiDailyAttemptLimiter
  storage:
    passer-proof-directory: ${PASSER_PROOF_STORAGE_PATH:./uploads/passer-proofs}
    proof-retention-days: ${PASSER_PROOF_RETENTION_DAYS:30}   # 검수 완료(승인·반려) 후 증빙 이미지를 보관하는 일수. ProofRetentionScheduler
  admin:
    # 검수(관리자) 계정. "KAKAO:카카오회원번호" 콤마 구분. 로그인 시 역할이 동기화된다.
    provider-ids: ${ADMIN_PROVIDER_IDS:}
  oauth2:
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
  cors:
    # 콤마로 구분해 여러 개 지정 가능 (배포 시 실제 프론트 도메인 추가)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-please-change-in-production}
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash
    key-in-header: ${GEMINI_API_KEY_IN_HEADER:true}   # true: x-goog-api-key 헤더, false: ?key= 쿼리(로그 유출 위험, 비상 복귀용)
    # 서비스 전역 일일 호출 상한(성공·실패 무관한 시도 수). 0 이하면 상한 없음. GeminiDailyQuota 참고.
    daily-limit: ${GEMINI_DAILY_LIMIT:500}

management:
  endpoints:
    web:
      exposure:
        include: health   # 배포 헬스체크 전용. 그 외 엔드포인트는 노출하지 않는다
  endpoint:
    health:
      show-details: never   # 인증 없이 열리므로 DB 상태 등 내부 정보는 숨긴다

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.career: DEBUG
    org.springframework.security: INFO

---
# 로컬 개발 환경
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  flyway:
    clean-on-validation-error: true   # 로컬에서만 허용

---
# 프로덕션 환경
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

server:
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰해야
  # OAuth redirect-uri의 {baseUrl}이 실제 도메인으로 올바르게 만들어짐
  forward-headers-strategy: framework

logging:
  level:
    com.career: INFO
