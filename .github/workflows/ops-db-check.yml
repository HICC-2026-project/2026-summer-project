name: Ops DB Check (temporary)

# 일일 갱신 카운터 검증용 임시 읽기 전용 조회. 확인 후 삭제 예정.
# ⚠️ 저장소가 공개라 로그도 공개된다 — 닉네임·ID 등 식별 정보는 절대 출력하지 않는다.
on:
  workflow_dispatch:

jobs:
  query:
    name: 읽기 전용 카운터 조회
    runs-on: ubuntu-latest

    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 카운터 조회 (식별 정보 미출력)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set +x
          source ~/2026-summer-project/backend/.env
          HOSTDB=$(echo "$DB_URL" | sed 's|jdbc:postgresql://||')
          docker run --rm postgres:16-alpine psql "postgresql://$DB_USERNAME:$DB_PASSWORD@$HOSTDB" -c "
          SELECT row_number() OVER (ORDER BY r.created_at) AS anon_row,
                 r.daily_update_count      AS rec_count_today,
                 r.last_updated_date       AS rec_last_date,
                 r.created_at              AS rec_cache_updated_at,
                 (r.result_json::json->>'scoreFormulaVersion') AS cache_ver,
                 (SELECT string_agg(a->>'deadline', ',')
                    FROM json_array_elements(r.result_json::json->'activities') a) AS activity_deadlines,
                 s.updated_at              AS spec_updated_at,
                 t.updated_at              AS target_updated_at,
                 rc.daily_update_count     AS roadmap_count_today,
                 rc.last_updated_date      AS roadmap_last_date
          FROM recommendations r
          LEFT JOIN user_specs s ON s.user_id = r.user_id
          LEFT JOIN target_jobs t ON t.user_id = r.user_id
          LEFT JOIN roadmap_caches rc ON rc.user_id = r.user_id
          ORDER BY r.created_at;"
          REMOTE
