name: Ops DB Check (temporary)

# 점수 공식 v7 재계산 검증용 임시 조회 — EC2 내부에서 실제 API 응답을 확인한다. 확인 후 삭제 예정.
# ⚠️ 저장소가 공개라 로그도 공개된다 — 닉네임·ID·토큰 등 식별 정보는 절대 출력하지 않는다.
on:
  workflow_dispatch:

jobs:
  query:
    name: v7 재계산 응답 검증
    runs-on: ubuntu-latest

    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 실제 추천 API 응답으로 v7 재계산 확인 (식별 정보 미출력)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set +x
          source ~/2026-summer-project/backend/.env
          HOSTDB=$(echo "$DB_URL" | sed 's|jdbc:postgresql://||')
          # 캐시가 있는 유저의 id를 EC2 안에서만 사용한다(로그에 출력하지 않음).
          UID2=$(docker run --rm postgres:16-alpine psql "postgresql://$DB_USERNAME:$DB_PASSWORD@$HOSTDB" -t -A -c \
            "SELECT user_id FROM recommendations ORDER BY created_at LIMIT 1 OFFSET 1;")
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          H=$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)
          NOW=$(date +%s); EXP=$((NOW+600))
          P=$(printf '{"jti":"ops-v7-check","sub":"%s","role":"USER","typ":"access","iat":%s,"exp":%s}' "$UID2" "$NOW" "$EXP" | b64url)
          SIG=$(printf '%s.%s' "$H" "$P" | openssl dgst -sha256 -hmac "$JWT_SECRET" -binary | b64url)
          TOKEN="$H.$P.$SIG"
          curl -s -m 150 localhost:8080/api/v1/recommendations -H "Authorization: Bearer $TOKEN" | python3 -c '
          import json,sys
          j=json.load(sys.stdin)
          print(json.dumps({
            "scoreFormulaVersion": j.get("scoreFormulaVersion"),
            "matchScore": j.get("matchScore"),
            "similarPasserCount": j.get("similarPasserCount"),
            "dailyLimitReached": j.get("dailyLimitReached"),
            "compareRowCount": len(j.get("compareRows") or []),
            "activityCount": len(j.get("activities") or []),
          }))'
          REMOTE
