name: Ops DB Check (temporary)

# 시연 준비용 계정 완전 초기화(닉네임 '이지우'). 확인 후 삭제 예정.
# ⚠️ 저장소가 공개라 로그도 공개된다 — 닉네임·ID 등 식별 정보는 절대 출력하지 않는다.
on:
  workflow_dispatch:

jobs:
  reset:
    name: 계정 완전 초기화 (식별 정보 미출력)
    runs-on: ubuntu-latest

    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 닉네임 '이지우' 계정 및 연관 데이터 삭제
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set +x
          source ~/2026-summer-project/backend/.env
          HOSTDB=$(echo "$DB_URL" | sed 's|jdbc:postgresql://||')
          CONN="postgresql://$DB_USERNAME:$DB_PASSWORD@$HOSTDB"
          docker run --rm postgres:16-alpine psql "$CONN" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE
            target_id UUID;
          BEGIN
            SELECT id INTO target_id FROM users WHERE nickname = '이지우' LIMIT 1;
            IF target_id IS NULL THEN
              RAISE EXCEPTION '해당 닉네임의 계정을 찾을 수 없습니다';
            END IF;
            DELETE FROM recommendations WHERE user_id = target_id;
            DELETE FROM roadmap_caches WHERE user_id = target_id;
            DELETE FROM user_specs WHERE user_id = target_id;
            DELETE FROM target_jobs WHERE user_id = target_id;
            DELETE FROM refresh_tokens WHERE user_id = target_id;
            DELETE FROM users WHERE id = target_id;
            RAISE NOTICE '계정 완전 초기화 완료';
          END \$\$;
          "
          REMOTE
